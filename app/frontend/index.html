<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Fatigue Predictor + Causal Explanation (Demo)</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <h1>Fatigue Predictor + Causal Explanation (Demo)</h1>

  <h2>Paste a JSON feature object</h2>
  <p class="tip">
    Tip: copy one row from <code>outputs/features_all.csv</code> and convert to JSON key:value pairs.
  </p>

  <div class="row">
    <textarea id="jsonBox" rows="14" cols="45">{
  "hr_mean": 80.2,
  "eda_mean": 0.21,
  "temp_mean": 34.1
}</textarea>

    <div class="controls">
      <label>
        <input id="applyNorm" type="checkbox" checked />
        Apply normalization (recommended)
      </label>
      <button id="btnPredict">Predict</button>
    </div>
  </div>

  <h2>Output</h2>
  <pre id="out">{}</pre>

  <script src="/static/app.js"></script>
</body>
</html>
